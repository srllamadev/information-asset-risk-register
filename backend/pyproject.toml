[project]
name = "sakura-risk-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.41",
  "alembic==1.15.2", "pydantic==2.11.4", "argon2-cffi==23.1.0",
  "PyJWT==2.10.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
